<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booklist</title>
</head>

<body>
    <div>
        <h1>Hello <span sec:authentication="name"></span>!</h1>
        <form th:action="@{/logout}" method="post">
            <input type="submit" value="Sign Out"/>
        </form>
        <h1>Books</h1>
        <table>
            <tr>
                <th>Author</th>
                <th>Title</th>
                <th>ISBN</th>
                <th>Year</th>
            </tr>

            <tr th:each="b : ${books}">
                <td th:text="${b.author}"></td>
                <td th:text="${b.title}"></td>
                <td th:text="${b.isbn}"></td>
                <td th:text="${b.publicationYear}"></td>
                <td sec:authorize="hasRole ('ADMIN')"><a th:href="@{/delete/{id}(id=${b.id})}">Delete</a></td>
                <td><a th:href="@{/edit/{id}(id=${b.id})}">Edit</a></td>
            </tr>
        </table>
        <a href="/addbook" class="btn btn-primary">Add Book</a>
    </div>
</body>

</html>
