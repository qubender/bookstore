<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Modify books</h1>
    <form th:object="${book}" th:action="@{/save}" method="post">
        <label for="id"></label>
        <input type="hidden" id="id" th:field="*{id}" readonly="readonly" />
        <div style="clear:both; display:block; height: 10px;"></div>
        <label for="title">Title</label>
        <input type="text" id="title" th:field="*{title}" />
        <label for="author">Author</label>
        <input type="text" id="author" th:field="*{author}" />
        <label for="isbn">ISBN</label>
        <input type="text" id="isbn" th:field="*{isbn}" />
        <label for="publicationYear">Year</label>
        <input type="text" id="publicationYear" th:field="*{publicationYear}" />
        <label for="price">Price</label>
        <input type="text" id="price" th:field="*{price}" />
        <input class="btn btn-success" type="submit" value="save"></input>
    </form>
</body>

</html>
